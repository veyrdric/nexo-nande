# proyecto-promise — entorno de desarrollo local
# Uso: `make up` (lee ../.env). No ejecutar a mano sin --env-file.
# Todos los puertos se publican solo en 127.0.0.1: nada queda expuesto a la red del evento.
# El túnel (ngrok/cloudflared) corre en el host y apunta al backend (127.0.0.1:${BACKEND_PORT}).

name: promise

services:
  # --- Base de datos: Postgres 16 + pgvector (imagen disponible offline) -----
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Redis: memoria de 24 h y rate limit. Sin persistencia a disco (privacidad).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # --- Transcripción local [P1] ------------------------------------------------
  speaches:
    profiles: ["audio"]
    # PENDIENTE: fijar tag exacto tras la prueba (hoy: variante CPU).
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # PENDIENTE DE VALIDAR: ruta de caché de modelos dentro de la imagen (para trabajar offline).
      - speaches-models:/home/ubuntu/.cache/huggingface

  # --- n8n: ingesta de PDF [P2] -----------------------------------------------
  n8n:
    profiles: ["pdf"]
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: ${TZ}
      # PENDIENTE DE VALIDAR (Bloque 3): no guardar datos de ejecuciones exitosas y purgar a las 24 h.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 24
      N8N_DIAGNOSTICS_ENABLED: "false"
      INGEST_HMAC_SECRET: ${INGEST_HMAC_SECRET}
      BACKEND_INTERNAL_URL: http://backend:${BACKEND_PORT}
    volumes:
      - n8ndata:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"

  # --- Aplicación en contenedores (opcional, perfil "app") ----------------------
  backend:
    profiles: ["app"]
    image: node:22-alpine
    working_dir: /app/backend
    command: ["sh", "-c", "npm install && npm run start:dev"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STT_BASE_URL: http://speaches:8000/v1
    volumes:
      - ..:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    image: node:22-alpine
    working_dir: /app/frontend
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ..:/app
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pgdata:
  n8ndata:
  speaches-models:
